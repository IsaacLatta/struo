
name: ci

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which platforms to test?
        type: choice
        default: all
        options:
          - all
          - linux
          - windows

permissions:
  contents: read
  actions: write

jobs:
  windows:
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        preset: [msvc-debug, msvc-release]

    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/external/vcpkg

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  linux:
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04]
        preset: [gcc-debug, gcc-release, clang-debug, clang-release]

    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/external/vcpkg

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
